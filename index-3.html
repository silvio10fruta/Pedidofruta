<title>Pedido y ventas</title>
<style>
  :root{
    --bg:#FAF7F1;
    --paper:#FFFFFF;
    --ink:#2B2620;
    --ink-soft:#75695A;
    --line:#E7DECC;
    --green:#3F6B4F;
    --green-dark:#2E5039;
    --green-soft:#E7F0E9;
    --blue:#3D5A73;
    --blue-dark:#2C4457;
    --blue-soft:#E6EDF2;
    --citrus:#D98A3D;
    --citrus-soft:#FBEAD3;
    --danger:#B4553E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--green);
    color:#fff;
    padding:14px 16px 0;
    transition:background .2s ease;
  }
  header.tab-venta{background:var(--blue);}
  header h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header .sub{
    font-size:12.5px;
    color:#DCEADF;
  }
  header.tab-venta .sub{color:#DCE6EE;}

  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .date-nav-label{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .nav-arrow{
    width:28px;
    height:28px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.14);
    color:#fff;
    border-radius:8px;
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .today-pill{
    border:none;
    background:rgba(255,255,255,.28);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    cursor:pointer;
  }

  .tabs{
    display:flex;
    gap:4px;
    margin-top:12px;
    background:rgba(255,255,255,.15);
    border-radius:10px;
    padding:3px;
  }
  .tabs button{
    flex:1;
    border:none;
    background:transparent;
    color:#fff;
    opacity:.75;
    font-size:13.5px;
    font-weight:600;
    padding:9px 0;
    border-radius:8px;
    cursor:pointer;
  }
  .tabs button.active{
    background:#fff;
    opacity:1;
  }
  .tabs button.active.tab-pedido-btn{color:var(--green-dark);}
  .tabs button.active.tab-venta-btn{color:var(--blue-dark);}

  .delivery-note{
    margin-top:10px;
    font-size:12.5px;
    background:rgba(255,255,255,.14);
    border-radius:8px;
    padding:8px 10px;
    line-height:1.4;
  }
  .delivery-note.warn{
    background:var(--citrus-soft);
    color:#7A4A1C;
  }

  .auto-row{
    margin-top:10px;
  }
  .auto-btn{
    width:100%;
    background:rgba(255,255,255,.16);
    color:#fff;
    border:1px solid rgba(255,255,255,.35);
    border-radius:9px;
    padding:9px 10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }

  .searchwrap{
    margin-top:12px;
    padding-bottom:14px;
    position:relative;
  }
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border-radius:10px;
    border:none;
    font-size:15px;
    background:#fff;
    color:var(--ink);
  }
  .searchwrap input::placeholder{color:#A79C8C;}

  main{padding:14px 12px 0;}

  .cat{
    margin-bottom:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .cat.cat-highlight{
    border:1.5px solid var(--citrus);
    box-shadow:0 0 0 1px var(--citrus-soft);
  }
  .cat.cat-highlight > .cat-head{
    background:var(--citrus-soft);
  }
  .cat.cat-highlight > .cat-head h2{
    color:#8A5420;
  }
  .cat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    cursor:pointer;
    user-select:none;
  }
  .cat-head h2{
    margin:0;
    font-size:14.5px;
    font-weight:700;
    color:var(--green-dark);
  }
  .tab-venta ~ main .cat-head h2{color:var(--blue-dark);}
  .cat-head .count{
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .cat-head .chev{
    color:var(--ink-soft);
    font-size:12px;
    transition:transform .15s ease;
  }
  .cat.open .chev{transform:rotate(90deg);}
  .cat-body{
    display:none;
    border-top:1px solid var(--line);
  }
  .cat.open .cat-body{display:block;}

  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--line);
  }
  .item:first-child{border-top:none;}
  .item.active{background:var(--green-soft);}
  body[data-tab="venta"] .item.active{background:var(--blue-soft);}
  .item-name{
    font-size:13.5px;
    line-height:1.3;
    flex:1;
    min-width:0;
  }
  .item-name .code{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    flex-shrink:0;

function itemName(code){
  for(const group of CATALOG){
    const found = group.items.find(i => i[0] === code);
    if(found) return found[1];
  }
  return code;
}

const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function fmtDate(d){
  return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtShort(d){
  return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function isGranel(unit){ return GRANEL_UNITS.includes(unit); }
function pedidoStep(){ return 1; }
function ventaStep(unit){ return isGranel(unit) ? 0.5 : 1; }

// Tamaño de la caja de cada referencia (4º campo del catálogo).
// En el Pedido del día, la cantidad que escribe el usuario representa
// número de cajas, no unidades/kg sueltos: hay que multiplicar por este
// tamaño para saber la cantidad real a pedir. En Ventas NO se aplica.
function boxSize(code){
  for(const group of CATALOG){
    const found = group.items.find(i => i[0] === code);
    if(found && found[3]) return found[3];
  }
  return 1;
}

// window.storage solo existe dentro de Claude.ai. Fuera de ahí (GitHub Pages, etc.)
// no existe, así que lo reemplazamos por una versión que usa localStorage del navegador,
// que sí persiste los datos en el celular.
if(!window.storage){
  window.storage = {
    async get(key, shared){
      const v = localStorage.getItem(key);
      return v !== null ? {key, value:v, shared: !!shared} : null;
    },
    async set(key, value, shared){
      localStorage.setItem(key, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return {key, deleted: existed, shared: !!shared};
    },
    async list(prefix, shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(!prefix || k.startsWith(prefix)) keys.push(k);
      }
      return {keys, prefix, shared: !!shared};
    }
  };
}

let currentTab = 'pedido';
const state = { pedido:{}, venta:{}, stock:{} };
let pedidoKey = "", ventaKey = "";
let realToday = new Date();      // fecha real de hoy, fija
let todayDate = new Date();      // fecha que se está viendo/editando (navegable)

function expiryClass(dateStr){
  if(!dateStr) return '';
  const today = new Date(realToday.toISOString().slice(0,10));
  const exp = new Date(dateStr);
  const diffDays = Math.round((exp - today) / 86400000);
  if(diffDays < 0) return 'exp-past';
  if(diffDays <= 2) return 'exp-soon';
  return '';
}

async function loadStock(){
  try{
    const res = await window.storage.list('stock:', false);
    if(res && res.keys){
      for(const k of res.keys){
        try{
          const item = await window.storage.get(k, false);
          if(item && item.value){
            const code = k.slice('stock:'.length);
            state.stock[code] = JSON.parse(item.value);
          }
        }catch(e){}
      }
    }
  }catch(e){ /* aún no hay stock guardado */ }
}

async function saveStock(code, initial, current, expiry){
  const data = { initial: initial || 0, current: Math.max(0, current || 0), expiry: expiry || "" };
  state.stock[code] = data;
  try{
    await window.storage.set('stock:' + code, JSON.stringify(data), false);
  }catch(e){
    console.error('No se pudo guardar el stock', e);
  }
}

// Cada venta de una referencia de Ensaladas y bowls descuenta del stock actual.
// Cuando el stock cae a la mitad (o menos) del stock inicial, repone automáticamente
// esa cantidad en el pedido del día que se esté viendo.
async function applyStockSale(code, delta){
  if(delta === 0) return;
  const s = state.stock[code] || { initial:0, current:0, expiry:"" };
  s.current = Math.max(0, (s.current || 0) - delta);
  state.stock[code] = s;
  try{
    await window.storage.set('stock:' + code, JSON.stringify(s), false);
  }catch(e){
    console.error('No se pudo actualizar el stock', e);
  }
  if(delta > 0) await checkAutoOrder(code);
}

async function checkAutoOrder(code){
  const s = state.stock[code];
  if(!s || !s.initial) return;
  if(s.current > s.initial / 2) return;
  const need = Math.max(0, s.initial - s.current);
  if(need <= 0) return;

  // El stock se lleva en unidades reales, pero el pedido se guarda en cajas:
  // convertimos la necesidad a nº de cajas (redondeando hacia arriba).
  const box = boxSize(code);
  const neededBoxes = Math.ceil(need / box);
  if((state.pedido[code] || 0) >= neededBoxes) return;

  state.pedido[code] = neededBoxes;
  try{
    await window.storage.set(pedidoKey, JSON.stringify(state.pedido), false);
  }catch(e){
    console.error('No se pudo guardar el pedido automático', e);
  }
  toast(`Pedido automático: ${neededBoxes} caja${neededBoxes===1?'':'s'} de ${itemName(code)} (stock bajo)`);
  if(currentTab === 'pedido'){ render(); } else { updateBottomBar(); }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function updateDateHeader(){
  const isToday = todayDate.toISOString().slice(0,10) === realToday.toISOString().slice(0,10);
  document.getElementById('dateSub').textContent = fmtDate(todayDate) + (isToday ? ' · hoy' : '');
  document.getElementById('todayBtn').style.display = isToday ? 'none' : 'inline-block';
}

async function loadDay(){
  pedidoKey = 'pedido:' + todayDate.toISOString().slice(0,10);
  ventaKey  = 'venta:'  + todayDate.toISOString().slice(0,10);
  updateDateHeader();
  renderDeliveryNote(todayDate.getDay());

  state.pedido = {};
  state.venta = {};
  try{
    const res = await window.storage.get(pedidoKey, false);
    if(res && res.value) state.pedido = JSON.parse(res.value);
  }catch(e){}
  try{
    const res = await window.storage.get(ventaKey, false);
    if(res && res.value) state.venta = JSON.parse(res.value);
  }catch(e){}

  render();
}

function changeDay(delta){
  const d = new Date(todayDate);
  d.setDate(d.getDate() + delta);
  todayDate = d;
  loadDay();
}

function goToToday(){
  todayDate = new Date(realToday);
  loadDay();
}

    await window.storage.set(key, JSON.stringify(data), false);
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function renderDeliveryNote(dow){
  const noteEl = document.getElementById('deliveryNote');
  const info = DELIVERY_MAP[dow];
  if(!info || currentTab !== 'pedido'){
    noteEl.style.display = 'none';
    document.getElementById('autoRow').style.display = 'none';
    return;
  }
  noteEl.style.display = 'block';
  document.getElementById('autoRow').style.display = 'block';
  if(info.cover > 1){
    noteEl.classList.add('warn');
    noteEl.textContent = `⚠ Este pedido llega el ${info.days} y ${info.extra} — pide cantidades para 2 días.`;
  } else {
    noteEl.classList.remove('warn');
    noteEl.textContent = `Este pedido llega el ${info.days}.`;
  }
}

function setQty(code, val){
  const isPedido = currentTab === 'pedido';
  val = Math.max(0, Math.round(val*100)/100);
  const bucket = isPedido ? state.pedido : state.venta;
  const prevVal = bucket[code] || 0;
  if(val === 0){ delete bucket[code]; }
  else { bucket[code] = val; }
  saveState();
  updateBottomBar();

  if(!isPedido && ENSALADAS_CODES.has(code)){
    applyStockSale(code, val - prevVal);
  }
}

function updateBottomBar(){
  const bucket = currentTab === 'pedido' ? state.pedido : state.venta;
  const count = Object.keys(bucket).length;
  document.getElementById('itemCount').textContent =
    count === 0 ? '0 artículos' : (count + (count===1 ? ' artículo' : ' artículos'));
  document.getElementById('itemCountLabel').textContent =
    currentTab === 'pedido' ? 'en este pedido' : 'registrados este día';
  document.getElementById('generateBtn').textContent =
    currentTab === 'pedido' ? 'Enviar a WhatsApp' : 'Enviar resumen';
  document.getElementById('generateBtn').disabled = count === 0;
}

function render(){
  const listEl = document.getElementById('catList');
  listEl.innerHTML = '';
  const q = document.getElementById('search').value.trim().toLowerCase();
  const bucket = currentTab === 'pedido' ? state.pedido : state.venta;
  let anyMatch = false;

  CATALOG.forEach((group, gi) => {
    const filtered = group.items.filter(([code,name]) =>
      !q || name.toLowerCase().includes(q) || code.includes(q)
    );
    if(filtered.length === 0) return;
    anyMatch = true;

    const catDiv = document.createElement('div');
    catDiv.className = 'cat' + (q ? ' open' : '') + (group.cat === "Ensaladas y bowls" ? ' cat-highlight' : '');
    catDiv.dataset.idx = gi;

    const activeInGroup = group.items.filter(([code]) => bucket[code]).length;

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `<h2>${group.cat}</h2>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="count">${activeInGroup ? activeInGroup + ' sel · ' : ''}${filtered.length}</span>
        <span class="chev">▶</span>
      </div>`;
    head.addEventListener('click', () => catDiv.classList.toggle('open'));
    catDiv.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cat-body';

    filtered.forEach(([code,name,unit,pedidoUnit]) => {
      const s = currentTab === 'pedido' ? 1 : ventaStep(unit);
      const box = boxSize(code);
      const showReal = currentTab === 'pedido' && box > 1;
      const row = document.createElement('div');
      row.className = 'item' + (bucket[code] ? ' active' : '');
      row.innerHTML = `
        <div class="item-name">${name}<span class="code">#${code} · ${unit} ${pedidoUnit}</span></div>
        <div class="stepper-col">
          <div class="stepper">
            <button class="dec" aria-label="menos">−</button>
            <input type="number" min="0" step="${s}" value="${bucket[code] || 0}" inputmode="${s<1?'decimal':'numeric'}">
            <button class="inc" aria-label="más">+</button>
          </div>
          ${showReal ? `<div class="real-qty">${(bucket[code]||0) * box} ${unit.toLowerCase()}</div>` : ''}
        </div>`;
      const input = row.querySelector('input');
      const realQtyEl = row.querySelector('.real-qty');
      const updateReal = (v) => { if(realQtyEl) realQtyEl.textContent = `${Math.round(v*box*100)/100} ${unit.toLowerCase()}`; };
      row.querySelector('.dec').addEventListener('click', () => {
        const v = Math.max(0, (parseFloat(input.value)||0) - s);
        input.value = v;
        row.classList.toggle('active', v>0);
        updateReal(v);
        setQty(code, v);
      });
      row.querySelector('.inc').addEventListener('click', () => {
        const v = (parseFloat(input.value)||0) + s;
        input.value = v;
        row.classList.add('active');
        updateReal(v);
        setQty(code, v);
      });
      input.addEventListener('change', () => {
        const v = parseFloat(input.value)||0;
        input.value = v;
        row.classList.toggle('active', v>0);
        updateReal(v);
        setQty(code, v);
      });
      body.appendChild(row);

      if(group.cat === "Ensaladas y bowls" && currentTab === 'pedido'){
        const stockData = state.stock[code] || {initial:0, current:0, expiry:""};
        const stockRow = document.createElement('div');
        stockRow.className = 'stock-row';
        stockRow.innerHTML = `
          <label>Stock
            <input type="number" min="0" step="1" class="stock-qty" value="${stockData.current || 0}">
          </label>
          <label>Caduca
            <input type="date" class="stock-exp ${expiryClass(stockData.expiry)}" value="${stockData.expiry || ''}">
          </label>`;
        const qtyInput = stockRow.querySelector('.stock-qty');
        const expInput = stockRow.querySelector('.stock-exp');
        qtyInput.addEventListener('change', () => {
          // Editar el stock a mano = reponer: se toma como el nuevo stock inicial y actual
          const v = Math.max(0, parseFloat(qtyInput.value) || 0);
          qtyInput.value = v;
          saveStock(code, v, v, expInput.value);
        });
        expInput.addEventListener('change', () => {
          expInput.className = 'stock-exp ' + expiryClass(expInput.value);
          const s = state.stock[code] || {initial:0, current:0, expiry:""};
          saveStock(code, s.initial, s.current, expInput.value);
        });
        body.appendChild(stockRow);
      }
    });

    catDiv.appendChild(body);
    listEl.appendChild(catDiv);
  });

  if(!anyMatch){
    listEl.innerHTML = '<div class="empty-search">Ningún producto coincide con la búsqueda.</div>';
  }
  updateBottomBar();
}

function buildOrderText(){
  const bucket = currentTab === 'pedido' ? state.pedido : state.venta;
  let lines;
  if(currentTab === 'pedido'){
    lines = [`Pedido ${fmtDate(todayDate)}`];
    const info = DELIVERY_MAP[todayDate.getDay()];
    if(info){
      lines.push(info.cover > 1 ? `Llega ${info.days} — ${info.extra}` : `Llega ${info.days}`);
    }
  } else {
    lines = [`Ventas ${fmtDate(todayDate)}`];
  }
  lines.push('');
  CATALOG.forEach(group => {
    const rows = group.items.filter(([code]) => bucket[code]);
    if(rows.length === 0) return;
    lines.push(group.cat + ':');
    rows.forEach(([code,name,unit]) => {
      if(currentTab === 'pedido'){
        const cajas = bucket[code];
        const box = boxSize(code);
        const realQty = Math.round(cajas * box * 100) / 100;
        const u = unit.toLowerCase();
        if(box > 1){
          lines.push(`- ${name}: ${realQty} ${u} (${cajas} caja${cajas===1?'':'s'} de ${box})`);
        } else {
          lines.push(`- ${name}: ${realQty} ${u}`);
        }
      } else {
        const u = isGranel(unit) ? 'kg' : 'ud';
        lines.push(`- ${name}: ${bucket[code]} ${u}`);
      }
    });
    lines.push('');
  });
  return lines.join('\n').trim();
}

const WHATSAPP_NUMBER = "34648882096"; // sin espacios, con prefijo de país

function sendToWhatsApp(){
  const text = buildOrderText();
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
}

// ---- Pedido automático: combina ventas recientes + stock estimado ----
// Idea: cuanto más se ha vendido últimamente y menos stock queda, más se pide.
// stock estimado = lo recibido en pedidos anteriores (convertido a unidades/kg reales)
// menos lo vendido desde entonces (para Ensaladas se usa el stock físico que ya se
// controla a mano, porque es más fiable que estimarlo por diferencia).

const HISTORY_WINDOW_DAYS = 21;     // días hacia atrás para estimar stock disponible
const CONSUMPTION_WINDOW_DAYS = 7;  // días hacia atrás para calcular la venta media diaria

function daysAgo(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const t = new Date(todayDate.toISOString().slice(0,10) + 'T00:00:00');
  return Math.round((t - d) / 86400000);
}

async function getHistoryMaps(prefix, windowDays){
  const results = [];
  for(let n=1; n<=windowDays; n++){
    const d = new Date(todayDate);
    d.setDate(d.getDate() - n);
    const dateStr = d.toISOString().slice(0,10);
    try{
      const res = await window.storage.get(prefix + dateStr, false);
      if(res && res.value){
        results.push({date:dateStr, data: JSON.parse(res.value)});
      }
    }catch(e){ /* no hay datos guardados ese día */ }
  }
  return results;
}

async function suggestSmartOrder(){
  const info = DELIVERY_MAP[todayDate.getDay()];
  if(!info){
    toast('Hoy no corresponde generar pedido según este ciclo.');
    return;
  }
  const bucketCount = Object.keys(state.pedido).length;
  if(bucketCount > 0){
    if(!confirm('Ya tienes cantidades puestas en el pedido de hoy. ¿Reemplazarlas con el pedido automático?')){
      return;
    }
  }

  toast('Calculando pedido automático...');

  const ventasHist = await getHistoryMaps('venta:', HISTORY_WINDOW_DAYS);
  const pedidosHist = await getHistoryMaps('pedido:', HISTORY_WINDOW_DAYS);

  // Venta media diaria de los últimos días con datos
  const ventasConsumo = ventasHist.filter(h => daysAgo(h.date) <= CONSUMPTION_WINDOW_DAYS);
  const totalVentaConsumo = {};
  ventasConsumo.forEach(h => {
    for(const [code,qty] of Object.entries(h.data)){
      totalVentaConsumo[code] = (totalVentaConsumo[code] || 0) + qty;
    }
  });
  const diasConDatos = Math.max(1, ventasConsumo.length);

  // Stock estimado a partir de todo lo pedido/vendido dentro de la ventana
  const totalPedidoReal = {};
  pedidosHist.forEach(h => {
    for(const [code,cajas] of Object.entries(h.data)){
      totalPedidoReal[code] = (totalPedidoReal[code] || 0) + cajas * boxSize(code);
    }
  });
  const totalVentaTodo = {};
  ventasHist.forEach(h => {
    for(const [code,qty] of Object.entries(h.data)){
      totalVentaTodo[code] = (totalVentaTodo[code] || 0) + qty;
    }
  });

  const suggestion = {};
  const allCodes = new Set([...Object.keys(totalVentaConsumo), ...Object.keys(totalPedidoReal)]);

  allCodes.forEach(code => {
    const avgDaily = (totalVentaConsumo[code] || 0) / diasConDatos;
    if(avgDaily <= 0) return; // sin ventas recientes, no se pide automáticamente

    let stockEst;
    const s = state.stock[code];
    if(s && s.initial){
      stockEst = s.current || 0; // Ensaladas: se usa el stock físico controlado a mano
    } else {
      stockEst = Math.max(0, (totalPedidoReal[code] || 0) - (totalVentaTodo[code] || 0));
    }

    const neededReal = avgDaily * info.cover - stockEst;
    if(neededReal <= 0) return;

    const box = boxSize(code);
    const neededBoxes = Math.ceil(neededReal / box);
    if(neededBoxes > 0) suggestion[code] = neededBoxes;
  });

  if(Object.keys(suggestion).length === 0){
    toast('No hay ventas recientes suficientes para calcular un pedido automático.');
    return;
  }

  state.pedido = suggestion;
  await saveState();
  render();

  toast(`Pedido automático listo: ${Object.keys(suggestion).length} referencias. Revísalo y toca "Enviar a WhatsApp".`);
}

// ---- Tabs ----

function switchTab(tab){
  currentTab = tab;
  document.body.dataset.tab = tab;
  document.getElementById('mainHeader').classList.toggle('tab-venta', tab==='venta');
  document.getElementById('tabPedidoBtn').classList.toggle('active', tab==='pedido');
  document.getElementById('tabVentaBtn').classList.toggle('active', tab==='venta');
  document.getElementById('tabTitle').textContent = tab==='pedido' ? 'Pedido del día' : 'Ventas del día';
  document.getElementById('modalTitle').textContent = 'Texto del pedido';
  renderDeliveryNote(todayDate.getDay());
  document.getElementById('search').value = '';
  render();
}

document.getElementById('prevDayBtn').addEventListener('click', () => changeDay(-1));
document.getElementById('nextDayBtn').addEventListener('click', () => changeDay(1));
document.getElementById('todayBtn').addEventListener('click', goToToday);

document.getElementById('tabPedidoBtn').addEventListener('click', () => switchTab('pedido'));
document.getElementById('tabVentaBtn').addEventListener('click', () => switchTab('venta'));
document.getElementById('autoBtn').addEventListener('click', suggestSmartOrder);

document.getElementById('search').addEventListener('input', render);

document.getElementById('clearBtn').addEventListener('click', () => {
  const bucket = currentTab === 'pedido' ? state.pedido : state.venta;
  if(Object.keys(bucket).length === 0) return;
  const label = currentTab === 'pedido' ? 'el pedido' : 'las ventas';
  if(confirm(`¿Vaciar ${label} de hoy?`)){
    if(currentTab === 'pedido') state.pedido = {}; else state.venta = {};
    saveState();
    render();
  }
});

// Botón principal: guarda (ya está guardado automáticamente en cada cambio) y abre WhatsApp directamente
document.getElementById('generateBtn').addEventListener('click', async () => {
  await saveState();
  sendToWhatsApp();
});

// Enlace secundario "Ver texto": abre el modal para revisar/copiar sin enviar
document.getElementById('viewTextLink').addEventListener('click', () => {
  document.getElementById('orderText').value = buildOrderText();
  document.getElementById('modalOverlay').classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('copyBtn').addEventListener('click', () => {
  const ta = document.getElementById('orderText');
  ta.select();
  try{ document.execCommand('copy'); toast('Texto copiado'); }
  catch(e){ navigator.clipboard?.writeText(ta.value); toast('Texto copiado'); }
});
document.getElementById('whatsappBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
  sendToWhatsApp();
});

// ---- Aviso para instalar el icono en la pantalla de inicio ----
function initInstallBanner(){
  const banner = document.getElementById('installBanner');
  const textEl = document.getElementById('installText');
  const closeBtn = document.getElementById('closeInstallBanner');

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; // ya está instalada, no mostrar nada

  const dismissed = localStorage.getItem ? null : null; // sin usar localStorage en este entorno
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);

  if(isIOS){
    textEl.textContent = 'Toca el botón Compartir y luego "Añadir a pantalla de inicio".';
  } else if(isAndroid){
    textEl.textContent = 'Abre el menú (⋮) del navegador y toca "Añadir a pantalla de inicio" o "Instalar app".';
  } else {
    textEl.textContent = 'Desde el menú del navegador, busca la opción "Instalar" o "Añadir a pantalla de inicio".';
  }

  banner.classList.add('show');
  closeBtn.addEventListener('click', () => banner.classList.remove('show'));

  // En Android/Chrome, si el navegador ofrece el evento nativo, mostramos un botón directo
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    const goBtn = document.createElement('button');
    goBtn.className = 'install-go';
    goBtn.textContent = 'Instalar ahora';
    goBtn.addEventListener('click', async () => {
      banner.classList.remove('show');
      e.prompt();
    });
    banner.appendChild(goBtn);
  });
}

(async function init(){
  initInstallBanner();
  await loadStock();
  await loadDay();
})();
